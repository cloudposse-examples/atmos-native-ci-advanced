name: Release
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  checks: write

env:
  ATMOS_PROFILE: github

jobs:
  promote:
    runs-on: ["ubuntu-latest"]
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Docker CLI
        run: apt-get update && apt-get install -y docker.io bc

      - name: Checkout
        uses: actions/checkout@v6

      - name: AWS Auth
        run: |
          atmos auth env --identity plat-dev/terraform --format dotenv | tr -d "'" >> $GITHUB_ENV
          atmos auth login --identity plat-dev/terraform

      - uses: cloudposse/github-action-docker-promote@v1
        id: promote
        with:
          organization: cloudposse-examples
          repository: atmos-native-ci
          registry: ${{ vars.ECR_REGISTRY }}
          from: sha-${{ github.sha }}
          to: ${{ github.event.release.tag_name }}
          use_metadata: false

    outputs:
      image: ${{ steps.promote.outputs.image }}
      tag: ${{ steps.promote.outputs.tag }}

  affected-staging:
    needs: [ promote ]
    runs-on: ["ubuntu-latest"]
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION }}
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trust Workspace
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Describe Affected
        id: affected
        run: atmos describe affected --format=matrix --output-file=$GITHUB_OUTPUT

  deploy-staging:
    needs: [ affected-staging, promote ]
    if: ${{ needs.affected-staging.outputs.matrix != '' }}
    runs-on: ["ubuntu-latest"]
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION }}
    strategy:
      matrix: ${{ fromJson(needs.affected-staging.outputs.matrix) }}
      fail-fast: false
    name: deploy / staging / ${{ matrix.component }}
    environment:
      name: staging
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy
        id: deploy
        env:
          APP_IMAGE: "${{ needs.promote.outputs.image }}:${{ needs.promote.outputs.tag }}"
        run: |
          atmos terraform deploy ${{ matrix.component }} -s ${{ matrix.stack }}

  affected-prod:
    needs: [ deploy-staging ]
    if: ${{ always() && needs.deploy-staging.result != 'failure' }}
    runs-on: ["ubuntu-latest"]
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION }}
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trust Workspace
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Describe Affected
        id: affected
        run: atmos describe affected --format=matrix --output-file=$GITHUB_OUTPUT

  deploy-production:
    needs: [ affected-prod, promote ]
    if: ${{ needs.affected-prod.outputs.matrix != '' }}
    runs-on: ["ubuntu-latest"]
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION }}
    strategy:
      matrix: ${{ fromJson(needs.affected-prod.outputs.matrix) }}
      fail-fast: false
    name: deploy / production / ${{ matrix.component }}
    environment:
      name: prod
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy
        id: deploy
        env:
          APP_IMAGE: "${{ needs.promote.outputs.image }}:${{ needs.promote.outputs.tag }}"
        run: |
          atmos terraform deploy ${{ matrix.component }} -s ${{ matrix.stack }}
